name: release

# 🔒 The owner's order (2026-11-10; workspace letter H33, release-process.md § 5): "the CI to
# check first, then push the tag, and then create the release page from the tag, then publish the
# package to the registry for the project in that order." Every push to main runs `checks`; when
# v.mod's version has no tag yet (scripts/release.ts pushed a bump), the same run goes on:
#
# - `checks` (U5; windows-latest — the binding links the MinGW wasmtime SDK): HEAD = github.sha;
#   "is this a release?" (the version is plain semver, above every v* tag, and has no tag yet);
#   the full gate — suite, example, surface, and the compatibility gate (`--release` for a release
#   candidate: the floor and, for a patch/minor, the previous tag's tests; report mode otherwise).
#   Runs third-party code (V, Zig, wasmtime) with a read-only token; the clone is tokenless.
# - `tag` (U6; release only): CI's annotated tag on the commit checks passed, through the REST API
#   (scripts/github-tag.ts): there at that commit = done, elsewhere = refused, read back.
# - `release` (U7): the GitHub Release page FROM the tag (scripts/github-release.ts, H32's order).
# - `publish` (U8 + U10): VPM has no upload — it installs the repository's `main` (measured
#   2026-11-10). So the tag is the publish, and this job is the read-back as a user: a scratch
#   `v install synapticforge1.uwl` must give this version, on a tree that contains the tagged
#   commit. It fails otherwise.
#
# A tag created with the job's GITHUB_TOKEN starts no new workflow run, so tag → page → publish
# run in THIS run (`needs:`); there is no tag trigger. U12: on a failure, "Re-run failed jobs" —
# each job skips what is already done (tag at this commit, existing page); never a new tag for the
# same code, never a moved tag.
#
# U9: `permissions: {}` at the top, each job only its own; no `uses:` steps — every tool comes
# from its official download, pinned by version AND sha256. Move a pin by changing both together:
# Bun from the release's SHASUMS256.txt (Tooling rule 10: the latest installed Bun, 1.4.4 on
# 2026-11-09); Zig from https://ziglang.org/download/index.json; V from the vlang/v release
# (0.5.2 = commit 7647ce1, the toolchain the local gate uses). The wasmtime SDK is pinned in
# scripts/fetch-wasmtime.ts. One concurrency group per commit, never cancelled.
#
# Old tags (v1.1.0 … v2.0.1) get no page: owner, 2026-11-09, "only new tags will get release
# pages" — so there is no workflow_dispatch trigger.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  BUN_SHA256_WINDOWS: cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5
  BUN_SHA256_LINUX: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
  ZIG_VERSION: 0.17.1
  ZIG_SHA256: b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e
  V_VERSION: 0.5.2
  V_SHA256: 5f1d619b6b04a2b54b4ad21826a25bdcba2acf75a941c8f72fc95672b6b064ca

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.clone.outputs.commit }}
      release: ${{ steps.is-release.outputs.release }}
      tag: ${{ steps.is-release.outputs.tag }}
    steps:
      - name: Clone (no token, full history for the compatibility gate)
        id: clone
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --detach "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Is this a release? (v.mod's version has no tag yet)
        id: is-release
        run: |
          set -euo pipefail
          version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" v.mod | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::v.mod version '$version' is not plain semver"; exit 1; }
          tag="v$version"
          tags="$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'refs/tags/v*' | sed 's#.*refs/tags/##')"
          if grep -qxF "$tag" <<< "$tags"; then
            echo "$tag is already tagged: not a release (checks only)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            newest="$(printf '%s\n' $tags | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
            if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
              echo "::error::v.mod's $tag is below the newest tag $newest"; exit 1
            fi
            echo "$tag is not tagged yet: a release candidate (newest tag: ${newest:-none})"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Bun, Zig and V (pinned by sha256)
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          get() { curl -fsSL --max-time 600 --retry 5 --retry-all-errors --retry-delay 5 -o "$1" "$2"; }
          get "$T/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-windows-x64.zip"
          echo "${BUN_SHA256_WINDOWS}  $T/bun.zip" | sha256sum -c -
          get "$T/zig.zip" "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip"
          echo "${ZIG_SHA256}  $T/zig.zip" | sha256sum -c -
          get "$T/v.zip" "https://github.com/vlang/v/releases/download/${V_VERSION}/v_windows.zip"
          echo "${V_SHA256}  $T/v.zip" | sha256sum -c -
          mkdir -p "$T/tools"
          unzip -q -d "$T/tools" "$T/bun.zip"
          unzip -q -d "$T/tools" "$T/zig.zip"
          unzip -q -d "$T/tools" "$T/v.zip"
          for d in "bun-windows-x64" "zig-x86_64-windows-${ZIG_VERSION}" "v"; do
            cygpath -w "$T/tools/$d" >> "$GITHUB_PATH"
          done

      - name: Toolchain
        run: bun --version && zig version && v version

      - name: Fetch the wasmtime C API SDK (pinned by sha256)
        run: bun scripts/fetch-wasmtime.ts

      - name: Suite
        run: bun scripts/test.ts

      - name: Example (the three adder lines)
        run: |
          set -euo pipefail
          export PATH="$PWD/vendor/wasmtime-v45.0.2-x86_64-mingw-c-api/lib:$PATH"
          out="$(v -cc "$(pwd -W)/scripts/zigcc.exe" run examples/adder.v)"
          echo "$out"
          for line in "adder(3, 4) = 7" "multiply(2.5, 4.0) = 10.0" "square(5) = 25"; do
            grep -qxF "$line" <<< "$out" || { echo "::error::example output lacks: $line"; exit 1; }
          done

      - name: Surface
        run: bun scripts/surface.ts --check

      - name: Compatibility gate
        run: |
          set -euo pipefail
          if [[ "${{ steps.is-release.outputs.release }}" == "true" ]]; then
            bun scripts/compat.ts --release
          else
            bun scripts/compat.ts
          fi

  tag:
    if: needs.checks.outputs.release == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only for the tag write in scripts/github-tag.ts
    steps:
      - name: Clone (no token) at the commit `checks` passed
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --detach "${{ needs.checks.outputs.commit }}"

      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256_LINUX}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Create the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ needs.checks.outputs.commit }}
        run: bun scripts/github-tag.ts

  release:
    needs: [checks, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only for the Release write in scripts/github-release.ts
    steps:
      - name: Clone (no token) at the commit `checks` passed
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --detach "${{ needs.checks.outputs.commit }}"

      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 300 --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256_LINUX}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Create the GitHub Release page from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ needs.checks.outputs.commit }}
        run: bun scripts/github-release.ts

  publish:
    needs: [checks, release]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install V (pinned by sha256)
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL --max-time 600 --retry 5 --retry-all-errors --retry-delay 5 -o "$T/v.zip" "https://github.com/vlang/v/releases/download/${V_VERSION}/v_windows.zip"
          echo "${V_SHA256}  $T/v.zip" | sha256sum -c -
          unzip -q -d "$T/tools" "$T/v.zip"
          cygpath -w "$T/tools/v" >> "$GITHUB_PATH"

      - name: Read back as a user — v install from VPM (fatal)
        env:
          TAG: ${{ needs.checks.outputs.tag }}
          SHA: ${{ needs.checks.outputs.commit }}
        run: |
          set -euo pipefail
          M="$(cygpath -u "$RUNNER_TEMP")/vmodules"
          # vpm clones into the system TEMP, then MOVES the clone into VMODULES — a rename, which
          # fails across drives. On the runner TEMP is on C: and RUNNER_TEMP on D:, so v2.0.3's
          # read-back failed with "error: failed to install" (log from the owner; reproduced
          # locally with VMODULES on D: and TEMP on C:, and fixed by a same-drive TEMP). So TEMP and
          # TMP point beside VMODULES, under RUNNER_TEMP.
          VT="$(cygpath -u "$RUNNER_TEMP")/vpm-tmp"
          # Three attempts, 300 s each (7.21). On a failure, v's own output goes into a PUBLIC
          # annotation (job logs need admin rights).
          ok=""
          for i in 1 2 3; do
            rm -rf "$M" "$VT" && mkdir -p "$M" "$VT"
            if out="$(TEMP="$(cygpath -w "$VT")" TMP="$(cygpath -w "$VT")" VMODULES="$(cygpath -w "$M")" timeout 300 v install synapticforge1.uwl 2>&1)"; then
              echo "$out"; ok=1; break
            else
              code=$?
              echo "$out"
              echo "::warning::v install attempt $i failed (exit $code): $(tail -5 <<< "$out" | tr '\r\n' '  ' | cut -c1-600)"
              [[ $i -lt 3 ]] && sleep 30
            fi
          done
          [[ -n "$ok" ]] || { echo "::error::v install synapticforge1.uwl failed 3 times; see the warnings above"; exit 1; }
          U="$M/synapticforge1/uwl"
          [[ -f "$U/v.mod" ]] || { echo "::error::v install reported success but $U/v.mod is missing"; exit 1; }
          got="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" "$U/v.mod" | head -1)"
          head="$(git -C "$U" rev-parse HEAD 2>&1)" || { echo "::error::the installed module is not a git checkout: $head"; exit 1; }
          echo "VPM installed version $got at $head"
          test "v$got" = "$TAG" || { echo "::error::VPM installed $got, not ${TAG#v}"; exit 1; }
          git -C "$U" merge-base --is-ancestor "$SHA" HEAD \
            || { echo "::error::the installed tree does not contain the tagged commit $SHA"; exit 1; }
          echo "VPM serves ${TAG}: $head contains $SHA"
